<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jom-Mula | Pembimbing Langkah-demi-Langkah</title>
    
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS tambahan untuk memastikan font Lexend diutamakan */
        body {
            font-family: 'Lexend', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen pb-12 bg-[#f9fafb]">

    <nav class="p-6 flex justify-between items-center bg-white border-b border-gray-100 mb-8">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-sm">J</div>
            <span class="text-xl font-semibold text-gray-800 tracking-tight">jom-mula</span>
        </div>
        <button class="p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </button>
    </nav>

    <main class="max-w-2xl mx-auto px-4">
        
        <section class="soft-card p-8 mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Konfigurasi Pengalaman</h1>
            <p class="text-gray-500 mb-6 text-sm">Sesuaikan cara bimbingan mengikut kesesuaian anda sekarang.</p>

            <div class="mb-6">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Keadaan Psikologi</label>
                <div class="grid grid-cols-2 gap-3">
                    <button data-type="mood" data-value="rela" class="profile-btn btn-toggle p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 text-gray-600 font-medium">✨ Rela / Teruja</button>
                    <button data-type="mood" data-value="paksa" class="profile-btn btn-toggle p-4 rounded-2xl border-2 border-gray-100 hover:border-indigo-200 text-gray-600 font-medium">⚡ Paksa / Segera</button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Tahap Pemahaman (IQ)</label>
                <div class="grid grid-cols-3 gap-2">
                    <button data-type="iqLevel" data-value="mudah" class="profile-btn btn-toggle p-3 rounded-xl border-2 border-gray-100 text-sm font-medium">Asas</button>
                    <button data-type="iqLevel" data-value="biasa" class="profile-btn btn-toggle p-3 rounded-xl border-2 border-gray-100 text-sm font-medium">Biasa</button>
                    <button data-type="iqLevel" data-value="pakar" class="profile-btn btn-toggle p-3 rounded-xl border-2 border-gray-100 text-sm font-medium">Pakar</button>
                </div>
            </div>
        </section>

        <section id="content-area">
            <div class="soft-card p-12 text-center text-gray-400">
                <p class="animate-pulse">Memuatkan panduan yang sesuai untuk anda...</p>
            </div>
        </section>

        <div class="mt-8 flex justify-center">
            <button id="next-step" class="bg-indigo-500 hover:bg-indigo-600 text-white px-10 py-4 rounded-full font-bold shadow-lg shadow-indigo-200 transition-all active:scale-95">
                Mula Teroka Sekarang
            </button>
        </div>

    </main>

    <script src="index.js"></script>
</body>
</html>
